name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout manifest-svelte
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/manifest-svelte
          path: web-workspace/manifest-svelte
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Checkout manifest-web
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/manifest-web
          path: web-workspace/manifest-web
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build manifest-web
        env:
          PUBLIC_MANIFEST_MODE: local
          PUBLIC_MANIFEST_API_URL: http://localhost:17010/api/v1
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
        run: |
          # Set up pnpm workspace so workspace:* resolves
          cat > web-workspace/pnpm-workspace.yaml << 'EOF'
          packages:
            - manifest-svelte
            - manifest-web
          EOF
          cd web-workspace
          pnpm install --no-frozen-lockfile
          pnpm --filter @manifest/svelte build
          pnpm --filter app build
          cd ..
          # Copy build to where rust-embed expects it
          mkdir -p ../manifest-web
          cp -r web-workspace/manifest-web/build ../manifest-web/
          ls -la ../manifest-web/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/manifest dist/
          cp README.md dist/
          cp LICENSE dist/ 2>/dev/null || true
          cd dist
          tar -czvf ../manifest-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: manifest-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  build-desktop:
    name: Build Desktop App (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout manifest-server
        uses: actions/checkout@v4
        with:
          path: manifest-server

      - name: Checkout manifest-workspace
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/manifest-workspace
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: workspace

      - name: Checkout manifest-svelte
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/manifest-svelte
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: workspace/manifest-svelte

      - name: Checkout manifest-app
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/manifest-workspace
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: workspace-full
          sparse-checkout: manifest-app

      - name: Set up workspace layout
        run: |
          # Link server into workspace so path dependency resolves
          ln -s ${{ github.workspace }}/manifest-server workspace/manifest-server
          # Copy manifest-app from workspace-full
          cp -r workspace-full/manifest-app workspace/manifest-app

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: workspace
        run: |
          cd manifest-svelte && pnpm install && pnpm build && cd ..
          cd manifest-app && pnpm install

      - name: Import Apple certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Tauri app (aarch64)
        working-directory: workspace/manifest-app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Build Tauri app (x86_64)
        working-directory: workspace/manifest-app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target x86_64-apple-darwin

      - name: Collect DMG artifacts
        run: |
          mkdir -p dist-desktop
          VERSION="${{ github.ref_name }}"
          cp workspace/manifest-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            dist-desktop/Manifest-${VERSION}-aarch64.dmg 2>/dev/null || true
          cp workspace/manifest-app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            dist-desktop/Manifest-${VERSION}-x86_64.dmg 2>/dev/null || true
          ls -la dist-desktop/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifest-desktop
          path: dist-desktop/*.dmg

  release:
    name: Create Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download artifacts for SHA256
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate SHA256 and update formula
        run: |
          VERSION="${{ github.ref_name }}"

          # Calculate SHA256 for each platform
          SHA_ARM=$(sha256sum artifacts/manifest-aarch64-apple-darwin/manifest-${VERSION}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_INTEL=$(sha256sum artifacts/manifest-x86_64-apple-darwin/manifest-${VERSION}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum artifacts/manifest-x86_64-unknown-linux-gnu/manifest-${VERSION}-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)

          echo "SHA256 (ARM):   $SHA_ARM"
          echo "SHA256 (Intel): $SHA_INTEL"
          echo "SHA256 (Linux): $SHA_LINUX"

          # Update formula
          cat > homebrew-tap/Formula/manifest.rb << 'FORMULA'
          class Manifest < Formula
            desc "MCP server for living feature documentation"
            homepage "https://github.com/manifestdocs/manifest"
            license "BUSL-1.1"
          FORMULA
          echo "  version \"${VERSION#v}\"" >> homebrew-tap/Formula/manifest.rb
          cat >> homebrew-tap/Formula/manifest.rb << FORMULA

            on_macos do
              on_arm do
                url "https://github.com/manifestdocs/manifest/releases/download/${VERSION}/manifest-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              end
              on_intel do
                url "https://github.com/manifestdocs/manifest/releases/download/${VERSION}/manifest-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/manifestdocs/manifest/releases/download/${VERSION}/manifest-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "manifest"
            end

            service do
              run [opt_bin/"manifest", "serve"]
              keep_alive true
              working_dir var/"manifest"
              log_path var/"log/manifest.log"
              error_log_path var/"log/manifest.log"
            end

            def post_install
              (var/"manifest").mkpath
              (var/"log").mkpath
            end

            test do
              system "#{bin}/manifest", "--help"
            end
          end
          FORMULA

      - name: Update Cask formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # Calculate SHA256 for desktop DMGs (if present)
          DMG_ARM="artifacts/manifest-desktop/Manifest-${VERSION}-aarch64.dmg"
          DMG_INTEL="artifacts/manifest-desktop/Manifest-${VERSION}-x86_64.dmg"

          if [ -f "$DMG_ARM" ] && [ -f "$DMG_INTEL" ]; then
            SHA_DMG_ARM=$(sha256sum "$DMG_ARM" | cut -d' ' -f1)
            SHA_DMG_INTEL=$(sha256sum "$DMG_INTEL" | cut -d' ' -f1)

            mkdir -p homebrew-tap/Casks
            cat > homebrew-tap/Casks/manifest.rb << CASK
          cask "manifest" do
            arch arm: "aarch64", intel: "x86_64"

            version "${VERSION_NUM}"
            sha256 arm:   "${SHA_DMG_ARM}",
                   intel: "${SHA_DMG_INTEL}"

            url "https://github.com/manifestdocs/manifest/releases/download/${VERSION}/Manifest-${VERSION}-#{arch}.dmg"
            name "Manifest"
            desc "Living documentation for feature-driven product engineering"
            homepage "https://github.com/manifestdocs/manifest"

            depends_on macos: ">= :catalina"

            app "Manifest.app"

            zap trash: [
              "~/.local/share/manifest",
              "~/Library/Application Support/com.manifest.app",
              "~/Library/Caches/com.manifest.app",
              "~/Library/Preferences/com.manifest.app.plist",
            ]
          end
          CASK
            echo "Cask updated with SHA256 (ARM): $SHA_DMG_ARM, (Intel): $SHA_DMG_INTEL"
          else
            echo "Desktop DMG artifacts not found, skipping Cask update"
          fi

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/manifest.rb
          git add Casks/manifest.rb 2>/dev/null || true
          git commit -m "Update manifest to ${{ github.ref_name }}"
          git push

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout manifest
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: manifest-site/pnpm-lock.yaml

      - name: Build manifest-site
        env:
          BASE_PATH: /manifest
        run: |
          cd manifest-site
          pnpm install
          pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: manifest-site/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  update-plugin:
    name: Update Claude Plugin
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest-plugin
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/manifest-plugin
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: manifest-plugin

      - name: Checkout claude-plugins
        uses: actions/checkout@v4
        with:
          repository: manifestdocs/claude-plugins
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: claude-plugins

      - name: Update plugin version and copy
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # Update plugin.json version
          cd manifest-plugin
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION_NUM}\"/" plugin.json
          cd ..

          # Copy plugin to claude-plugins repo
          cd claude-plugins
          rm -rf manifest
          cp -r ../manifest-plugin manifest

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest
          git commit -m "Update manifest plugin to ${VERSION}" || echo "No changes to commit"
          git push
