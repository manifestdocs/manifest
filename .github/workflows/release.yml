name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout manifest-web
        uses: actions/checkout@v4
        with:
          repository: rocket-tycoon/manifest-web
          path: manifest-web-repo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build manifest-web
        env:
          PUBLIC_MANIFEST_MODE: local
          PUBLIC_MANIFEST_API_URL: http://localhost:17010/api/v1
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
        run: |
          cd manifest-web-repo
          pnpm install
          pnpm build
          cd ..
          # Copy build to where rust-embed expects it
          mkdir -p ../manifest-web
          cp -r manifest-web-repo/build ../manifest-web/
          ls -la ../manifest-web/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/manifest dist/
          cp README.md dist/
          cp LICENSE dist/ 2>/dev/null || true
          cd dist
          tar -czvf ../manifest-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: manifest-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: rocket-tycoon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download artifacts for SHA256
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate SHA256 and update formula
        run: |
          VERSION="${{ github.ref_name }}"

          # Calculate SHA256 for each platform
          SHA_ARM=$(sha256sum artifacts/manifest-aarch64-apple-darwin/manifest-${VERSION}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_INTEL=$(sha256sum artifacts/manifest-x86_64-apple-darwin/manifest-${VERSION}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum artifacts/manifest-x86_64-unknown-linux-gnu/manifest-${VERSION}-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)

          echo "SHA256 (ARM):   $SHA_ARM"
          echo "SHA256 (Intel): $SHA_INTEL"
          echo "SHA256 (Linux): $SHA_LINUX"

          # Update formula
          cat > homebrew-tap/Formula/manifest.rb << 'FORMULA'
          class Manifest < Formula
            desc "MCP server for living feature documentation"
            homepage "https://github.com/rocket-tycoon/manifest"
            license "BUSL-1.1"
          FORMULA
          echo "  version \"${VERSION#v}\"" >> homebrew-tap/Formula/manifest.rb
          cat >> homebrew-tap/Formula/manifest.rb << FORMULA

            on_macos do
              on_arm do
                url "https://github.com/rocket-tycoon/manifest/releases/download/${VERSION}/manifest-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              end
              on_intel do
                url "https://github.com/rocket-tycoon/manifest/releases/download/${VERSION}/manifest-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/rocket-tycoon/manifest/releases/download/${VERSION}/manifest-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "manifest"
            end

            service do
              run [opt_bin/"manifest", "serve"]
              keep_alive true
              working_dir var/"manifest"
              log_path var/"log/manifest.log"
              error_log_path var/"log/manifest.log"
            end

            def post_install
              (var/"manifest").mkpath
              (var/"log").mkpath
            end

            test do
              system "#{bin}/manifest", "--help"
            end
          end
          FORMULA

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/manifest.rb
          git commit -m "Update manifest to ${{ github.ref_name }}"
          git push

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout manifest-web
        uses: actions/checkout@v4
        with:
          repository: rocket-tycoon/manifest-web
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build:pages
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_placeholder
          PUBLIC_MANIFEST_MODE: cloud

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  update-plugin:
    name: Update Claude Plugin
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest (for plugin source)
        uses: actions/checkout@v4
        with:
          path: manifest

      - name: Checkout claude-plugins
        uses: actions/checkout@v4
        with:
          repository: rocket-tycoon/claude-plugins
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: claude-plugins

      - name: Update plugin version and copy
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # Update plugin.json version
          cd manifest/manifest-plugin
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION_NUM}\"/" plugin.json

          # Copy plugin to claude-plugins repo
          cd ../../claude-plugins
          rm -rf manifest
          cp -r ../manifest/manifest-plugin manifest

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest
          git commit -m "Update manifest plugin to ${VERSION}" || echo "No changes to commit"
          git push
