[package]
name = "manifest-core"
version = "1.5.0"
edition = "2021"
description = "Core library for Manifest: models and database operations"
license = "BUSL-1.1"

[dependencies]
# Database - libSQL (SQLite-compatible, with Turso embedded replica support)
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "sync", "tls"] }

# Async runtime
tokio = { version = "1", features = ["sync", "rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Async traits (for dyn-safe async trait objects)
async-trait = "0.1"

# HTTP client (for GitHub backend)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
directories = "6"
thiserror = "2"
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
