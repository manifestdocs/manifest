[package]
name = "manifest"
version = "0.2.0"
edition = "2021"
description = "Living feature documentation server for AI-assisted development"
license = "MIT"
repository = "https://github.com/manifestdocs/manifest"

[[bin]]
name = "manifest"
path = "src/main.rs"

[dependencies]
# Core library (models + database)
manifest-core = { path = "manifest-core" }
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }

# HTTP client (for MCP remote mode)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# MCP Server
rmcp = { version = "0.13", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embedded web assets (optional — disabled when used as library in Tauri app)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
directories = "6"
dirs = "5"

# Security (API key auth for self-hosted)
subtle = "2"
validator = { version = "0.20", features = ["derive"] }
dotenvy = "0.15.7"
open = "5.3.3"

[features]
default = ["embed-web"]
embed-web = ["rust-embed", "mime_guess"]

[dev-dependencies]
tokio-test = "0.4"
speculate2 = "0.2"
axum-test = "17"
tempfile = "3"
sqlx = "0.8"
