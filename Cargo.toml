[workspace]
members = ["manifest-core"]

[package]
name = "manifest"
version = "0.1.31"
edition = "2021"
description = "Living feature documentation server for AI-assisted development"
license = "BUSL-1.1"
repository = "https://github.com/rocket-tycoon/manifest"

[[bin]]
name = "manifest"
path = "src/main.rs"

[dependencies]
# Core library (models + database)
manifest-core = { path = "manifest-core" }
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }

# HTTP client (for MCP remote mode)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# MCP Server
rmcp = { version = "0.13", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embedded web assets
rust-embed = "8"
mime_guess = "2"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
directories = "6"
dirs = "5"

# Security & Authentication
jsonwebtoken = "9"
argon2 = "0.5"
oauth2 = { version = "4", features = ["reqwest"] }
subtle = "2"
rand = "0.8"
base64 = "0.22"
validator = { version = "0.18", features = ["derive"] }
cookie = "0.18"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15.7"

[dev-dependencies]
tokio-test = "0.4"
speculate2 = "0.2"
axum-test = "17"
tempfile = "3"
